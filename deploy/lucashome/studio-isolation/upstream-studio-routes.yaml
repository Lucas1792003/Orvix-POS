# Upstream supabase/supabase self-hosted/v0.8.2 (commit 564eab8a), docker/volumes/api/envoy/lds.template.yaml,
# listener "supabase": the four routes that studio_isolation.py replaces (pg-protected, /api/mcp, /mcp, /).
# Verbatim at their original indentation (22). Used by `revert` to restore them. Placeholders only, no values.
# Do not edit: studio_isolation.py pins the sha256 of the lines below this header.
                      - name: pg-protected
                        match:
                          prefix: /pg/
                        route:
                          cluster: meta
                          prefix_rewrite: /
                          timeout: 30s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /pg/
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.cors:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                            allow_origin_string_match:
                              - exact: '${SUPABASE_PUBLIC_URL}'
                              - safe_regex:
                                  regex: 'https?://(localhost|127\.0\.0\.1)(:[0-9]+)?'
                            allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD"
                            allow_headers: "*"
                            expose_headers: "*"
                            max_age: "3600"

                      - match:
                          prefix: /api/mcp
                        route:
                          cluster: studio
                          timeout: 30s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /api/mcp
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: DENY
                                policies:
                                  deny_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /mcp
                        route:
                          cluster: studio
                          prefix_rewrite: /api/mcp
                          timeout: 30s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /mcp
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            # Block access to /mcp by default
                            rbac:
                              rules:
                                action: DENY
                                policies:
                                  deny_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true
                            # Enable local access (danger zone!)
                            # 1. Comment out the 'rbac' block above.
                            # 2. Uncomment and adjust the 'rbac' block below.
                            # 3. Add or adjust your local IPs in 'principals'.
                            #rbac:
                            #  rules:
                            #    action: ALLOW
                            #    policies:
                            #      allow_local:
                            #        permissions:
                            #          - any: true
                            #        principals:
                            #          - direct_remote_ip:
                            #              address_prefix: 127.0.0.1
                            #              prefix_len: 32
                            #          - direct_remote_ip:
                            #              address_prefix: ::1
                            #              prefix_len: 128

                      - match:
                          prefix: /
                        route:
                          cluster: studio
                          timeout: 30s
                        request_headers_to_remove:
                          - authorization
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true
