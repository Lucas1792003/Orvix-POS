# Migration 087 host prerequisite (v87.x, 2026-10-19): the recovery roles are supautils-RESERVED, so the Supabase
# privileged role (postgres, via supabase_privileged_role) cannot ALTER them (e.g. give recovery_owner LOGIN and a
# password) and its event triggers do not run as them. Runbook: docs/selfhost-migration/phase-g/recovery-roles-prerequisite.md
#
# This REPLACES the image's supautils.reserved_roles (conf.d is read after /etc/postgresql-custom/supautils.conf):
# the list below is the value shipped in supabase/postgres:17.6.1.136 + the three recovery roles, without the '*'
# suffix (a '*' role's settings stay changeable by the privileged role). On EVERY database image upgrade, regenerate it
# from the new image's /etc/postgresql-custom/supautils.conf before starting the new container.
supautils.reserved_roles = 'supabase_admin, supabase_auth_admin, supabase_storage_admin, supabase_read_only_user, supabase_realtime_admin, supabase_replication_admin, supabase_etl_admin, dashboard_user, pgbouncer, service_role*, authenticator*, authenticated*, anon*, supabase_privileged_role, recovery_owner, recovery_authority, recovery_gate'
